<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-label="X1 MYTVOnline4 foundation capability deck"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02060A"/><stop offset=".55" stop-color="#07111A"/><stop offset="1" stop-color="#03080D"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8FB3BF" stroke-opacity=".045"/></pattern></defs><style>g[font-family] > g > text:nth-of-type(1){font-size:11px;letter-spacing:2px}g[font-family] > g > text:nth-of-type(2){font-size:20px;letter-spacing:0}g[font-family] > g > text:nth-of-type(n+3){font-size:13.5px;letter-spacing:0}</style><rect width="1600" height="430" rx="28" fill="url(#bg)"/><rect width="1600" height="430" rx="28" fill="url(#grid)"/><text x="72" y="62" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#6ED8EA">X1 // FOUNDATION EXECUTION SURFACE</text><text x="72" y="108" font-family="Arial Black,Arial,sans-serif" font-size="36" fill="#F5FCFF">DEFINE THE CONTRACT. RELEASE ONLY WHEN READY.</text><path d="M72 134H1528" stroke="#17303A"/><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(72 168)"><rect width="340" height="190" rx="18" fill="#08131B" stroke="#19E8FF" stroke-width="2"/><text x="26" y="42" font-size="12" font-weight="700" letter-spacing="3" fill="#63DDEB">01 / DISCOVERY</text><text x="26" y="84" font-size="25" font-weight="800" fill="#F5FCFF">MAP THE TARGET</text><text x="26" y="118" font-size="16" fill="#8FB3BF">Device · build · contract surface</text><path d="M28 158h55M100 158h55M172 158h55" stroke="#19E8FF" stroke-width="4"/><circle cx="91" cy="158" r="7" fill="#19E8FF"/><circle cx="163" cy="158" r="7" fill="#19E8FF"/></g><g transform="translate(444 168)"><rect width="340" height="190" rx="18" fill="#08131B" stroke="#26CFFF" stroke-width="2"/><text x="26" y="42" font-size="12" font-weight="700" letter-spacing="3" fill="#63DDEB">02 / CONTRACT</text><text x="26" y="84" font-size="25" font-weight="800" fill="#F5FCFF">MAKE IT EXPLICIT</text><text x="26" y="118" font-size="16" fill="#8FB3BF">Inputs · outputs · compatibility</text><rect x="28" y="144" width="72" height="36" rx="7" fill="none" stroke="#26CFFF" stroke-width="3"/><path d="M115 153h92M115 170h64" stroke="#26CFFF" stroke-width="3"/></g><g transform="translate(816 168)"><rect width="340" height="190" rx="18" fill="#08131B" stroke="#4777FF" stroke-width="2"/><text x="26" y="42" font-size="12" font-weight="700" letter-spacing="3" fill="#86A5FF">03 / DEVICE VALIDATION</text><text x="26" y="84" font-size="25" font-weight="800" fill="#F5FCFF">PROVE THE BEHAVIOR</text><text x="26" y="118" font-size="16" fill="#8FB3BF">Test · observe · record evidence</text><circle cx="54" cy="158" r="18" fill="none" stroke="#4777FF" stroke-width="4"/><path d="M45 158l7 7 14-17" fill="none" stroke="#4777FF" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(1188 168)"><rect width="340" height="190" rx="18" fill="#08131B" stroke="#7B5CFF" stroke-width="2"/><text x="26" y="42" font-size="12" font-weight="700" letter-spacing="3" fill="#A897FF">04 / RELEASE GATE</text><text x="26" y="84" font-size="25" font-weight="800" fill="#F5FCFF">CLAIM ONLY EVIDENCE</text><text x="26" y="118" font-size="16" fill="#8FB3BF">Foundation ≠ public release</text><rect x="29" y="145" width="58" height="34" rx="6" fill="none" stroke="#7B5CFF" stroke-width="3"/><path d="M44 145v-12c0-18 28-18 28 0v12" fill="none" stroke="#7B5CFF" stroke-width="3"/></g></g><text x="800" y="402" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#6FBDCB">DISCOVER → DEFINE CONTRACT → IMPLEMENT → TEST → DEVICE VALIDATE → RELEASE</text></svg>